```html
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #02070b;
      color: #00eaff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1 {
      position: absolute;
      top: 25px;
      margin: 0;
      font-size: 42px;
      letter-spacing: 12px;
      text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
    }

    .reactor {
      width: 230px;
      height: 230px;
      border: 4px solid #00eaff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 15px #00eaff,
        0 0 40px #00eaff,
        inset 0 0 25px #00eaff;
      animation: pulse 2s infinite;
    }

    .reactor::before {
      content: "";
      width: 115px;
      height: 115px;
      border: 3px solid #00eaff;
      border-radius: 50%;
      box-shadow:
        0 0 15px #00eaff,
        inset 0 0 20px #00eaff;
    }

    .reactor::after {
      content: "";
      position: absolute;
      width: 35px;
      height: 35px;
      background: #00eaff;
      border-radius: 50%;
      box-shadow:
        0 0 15px #00eaff,
        0 0 35px #00eaff;
    }

    #durum {
      margin-top: 35px;
      min-height: 28px;
      font-size: 18px;
      text-align: center;
    }

    button {
      width: 250px;
      margin-top: 18px;
      padding: 14px;
      border: 2px solid #00eaff;
      border-radius: 10px;
      background: transparent;
      color: #00eaff;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 12px #00eaff;
    }

    button:hover {
      background: #00eaff;
      color: #02070b;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 15px #00eaff,
          0 0 40px #00eaff,
          inset 0 0 25px #00eaff;
      }

      50% {
        transform: scale(1.04);
        box-shadow:
          0 0 25px #00eaff,
          0 0 60px #00eaff,
          inset 0 0 35px #00eaff;
      }
    }
  </style>
</head>

<body>

  <h1>JARVIS</h1>

  <div class="reactor"></div>

  <div id="durum">Sistem hazır.</div>

  <button>JARVIS KONUŞ</button>
  <button>BENİ DİNLE</button>

</body>
</html>
```
